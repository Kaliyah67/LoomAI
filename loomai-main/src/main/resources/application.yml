server:
  port: 8081

spring:
  application:
    name: aiwear-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # MySQL数据源配置
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/bite_wear?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: bite@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # RabbitMQ 配置
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin123
    listener:
      simple:
        prefetch: 1

  # Redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: 1109021274@qq.com
    password: ${MAIL_PASSWORD:} # 授权码
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory

  # MyBatis-Plus配置
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true # 开启驼峰命名转换
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        id-type: auto # 主键自增

jwt:
  secret: abcdefghijklmnopqrstuvwxyz123456
  expiration: 2

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: lsq67
    max-size: 52428800

# Python AI / 向量检索侧车服务
python:
  ai:
    base-url: http://127.0.0.1:5000
    enabled: true

# 自定义日志配置
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta}%clr(---){faint} %clr([%15.15t]){cyan} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

